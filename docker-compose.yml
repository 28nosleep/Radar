name: radar-intelligence-engine

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: f117
      POSTGRES_USER: f117
      POSTGRES_PASSWORD: f117
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f117 -d f117"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      F117_DATABASE_URL: postgresql+asyncpg://f117:f117@postgres:5432/f117
    volumes:
      - ./config:/app/config:ro
    command: ["sh", "-c", "alembic upgrade head && exec radar scheduler"]
    restart: unless-stopped

volumes:
  postgres_data:
